<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Launchpad</title>


    <style>

        /* =====================================================
           基础
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            min-width: 100%;
            min-height: 100%;

            overflow: hidden;

            background:
                rgba(
                    8,
                    10,
                    16,
                    0.8
                );

            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                sans-serif;

        }


        html {
            background: transparent;
        }


        body {

            position: fixed;

            left: 0;
            top: 0;

            right: 0;
            bottom: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            background:
                rgba(
                    5,
                    7,
                    12,
                    0.9
                );

            opacity: 1;

        }


        /* =====================================================
           隐藏状态
           ===================================================== */

        body.launchpad-hidden {

            opacity: 0;

            pointer-events: none;

        }


        /* =====================================================
           显示状态
           ===================================================== */

        body.launchpad-visible {

            opacity: 1;

            pointer-events: auto;

        }


        /* =====================================================
           主容器
           ===================================================== */

        #app {

            position: fixed;

            left: 0;
            top: 0;

            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            margin: 0;

            padding:
                56px 68px 36px;

            overflow-y: auto;

            overflow-x: hidden;

            -webkit-overflow-scrolling: auto;
            scroll-behavior: auto;
            overscroll-behavior: none;
            touch-action: pan-y;
            scrollbar-width: none;

            background:
                rgba(
                    8,
                    10,
                    15,
                    0.08
                );

        }


        /* =====================================================
           工具栏
           ===================================================== */

        .toolbar {

            max-width: 1000px;

            margin:
                0 auto 22px;

            display: flex;

            justify-content: center;

        }


        .search-box {

            width: min(360px, 100%);

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 0 0 1px rgba(255,255,255,0.02);

            color: #ffffff;

            padding: 10px 16px;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.08s ease,
                background 0.08s ease,
                box-shadow 0.08s ease;

        }


        .search-box:focus {

            border-color: rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.09);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 0 0 1px rgba(255,255,255,0.03);

        }


        .search-box::placeholder {

            color: rgba(255, 255, 255, 0.5);

        }


        /* =====================================================
           App Grid
           ===================================================== */

        #apps {

            max-width: 1400px;

            margin:
                0 auto;

        }


        .app-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    8,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap:
                28px 50px;

            justify-content: center;

            align-items: start;

        }


        .empty-state {

            text-align: center;

            color: rgba(255, 255, 255, 0.7);

            padding: 40px 20px;

            font-size: 15px;

        }


        /* =====================================================
           App
           ===================================================== */

        .app {

            text-align: center;

            padding: 8px 10px;

            border-radius: 22px;

            cursor: pointer;

            min-width: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }


        .app[draggable="true"] {

            cursor: grab;

        }


        .app.dragging {

            opacity: 0.42;

        }


        .app.drag-over {

            outline: 1px solid rgba(255, 255, 255, 0.72);
            outline-offset: 2px;

        }


        .app.group-drop-target {

            background: rgba(255, 255, 255, 0.12);

        }


        /* =====================================================
           Icon Wrapper
           ===================================================== */

        .icon-wrapper {

            width: 96px;
            height: 96px;

            margin:
                0 auto 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 0;

            text-align: center;

            background: transparent;

        }


        .folder-icon {

            width: 72px;
            height: 72px;

            padding: 5px;

            display: flex;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 17px;

            background: rgba(255, 255, 255, 0.075);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.18),
                0 5px 18px rgba(0, 0, 0, 0.12);

            overflow: hidden;

            user-select: none;

        }


        .folder-icon.auto-folder {

            border-color: rgba(112, 218, 190, 0.78);

        }


        .folder-preview {

            flex: 1;

            display: grid;
            grid-template-columns: repeat(2, 22px);
            grid-auto-rows: 22px;
            align-content: center;
            justify-content: center;
            gap: 4px;

        }


        .folder-preview-icon {

            width: 22px;
            height: 22px;

            object-fit: contain;
            border-radius: 5px;

        }


        .folder-name-input {

            width: 100%;
            max-width: 88px;
            padding: 2px 4px;

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 5px;

            outline: none;
            background: rgba(10, 12, 18, 0.94);
            color: #ffffff;
            font: inherit;
            text-align: center;

        }


        .folder-context-menu {

            position: fixed;
            z-index: 20;
            min-width: 112px;
            padding: 4px;

            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 7px;

            background: rgba(24, 27, 34, 0.96);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);

        }


        .folder-context-menu button {

            width: 100%;
            padding: 7px 10px;

            border: 0;
            border-radius: 4px;

            background: transparent;
            color: #ffffff;
            font: inherit;
            text-align: left;
            cursor: pointer;

        }


        .folder-context-menu button:hover {

            background: rgba(255, 255, 255, 0.12);

        }


        /* =====================================================
           Icon
           ===================================================== */

        .icon {

            width: 86px;
            height: 86px;

            object-fit: contain;

            pointer-events: none;

            opacity: 1;

            border-radius: 18px;

            background: transparent;

            border: none;

            box-shadow: none;

        }


        /* =====================================================
           App Name
           ===================================================== */

        .name {

            font-size: 12px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            user-select: none;

            color: rgba(255, 255, 255, 0.9);

            max-width: 88px;

            letter-spacing: 0.01em;

            display: block;

            text-align: center;

            margin: 0 auto;

        }


        /* =====================================================
           Scrollbar
           ===================================================== */

        #app::-webkit-scrollbar {

            display: none;

        }

    </style>

</head>


<body class="launchpad-visible">


    <div id="app">

        <div class="toolbar">
            <input
                id="search"
                class="search-box"
                type="text"
                placeholder="搜索应用..."
                aria-label="搜索应用"
            >
        </div>

        <div id="apps"></div>

    </div>


    <script src="./app-utils.js"></script>

    <script>

        const allApps = [];
        const pendingIconUrls = new Map();
        const appOrders = new Map();
        const manualGroups = [];
        let renderFrameScheduled = false;
        let suppressAppClickUntil = 0;
        let editingManualGroupId = null;
        let folderContextMenu = null;
        const folderState = {
            currentFolderPath: null,
            currentManualGroupId: null,
        };

        function getParentFolderPath(appPath) {
            if (!appPath) {
                return null;
            }

            const normalized = String(appPath).replace(/\\/g, '/');
            const lastSlash = normalized.lastIndexOf('/');

            if (lastSlash <= 0) {
                return null;
            }

            const parentPath = normalized.substring(0, lastSlash);

            if (parentPath === '/Applications' || parentPath === '/System/Applications' || parentPath.endsWith('/Applications') || parentPath.endsWith('/System/Applications')) {
                return null;
            }

            return parentPath;
        }

        function buildFolderGrid(apps) {
            if (!Array.isArray(apps) || !apps.length) {
                return [];
            }

            if (folderState.currentManualGroupId) {
                return apps;
            }

            let sourceEntries = folderState.currentFolderPath
                ? apps
                : typeof window.buildFolderEntries === 'function'
                    ? window.buildFolderEntries(apps)
                    : apps;

            return typeof window.applyManualAppGroups === 'function'
                ? window.applyManualAppGroups(
                    sourceEntries,
                    manualGroups,
                    allApps,
                    folderState.currentFolderPath || null
                )
                : sourceEntries;
        }

        async function showFolder(folderPath, manualGroupId = null) {
            if (!folderPath) {
                folderState.currentFolderPath = null;
                folderState.currentManualGroupId = null;
                renderApps(allApps);
                return;
            }

            folderState.currentFolderPath = folderPath;
            folderState.currentManualGroupId = manualGroupId;
            if (!appOrders.has(folderPath)) {
                const folderOrder = await window.launchpad.getAppOrder(folderPath);

                if (
                    folderState.currentFolderPath !== folderPath ||
                    folderState.currentManualGroupId !== manualGroupId
                ) {
                    return;
                }

                appOrders.set(folderPath, folderOrder);
            }

            const manualGroup = manualGroupId
                ? manualGroups.find(group => group.id === manualGroupId)
                : null;
            const folderApps = manualGroup
                ? manualGroup.appPaths
                    .map(appPath => allApps.find(app => app.path === appPath))
                    .filter(Boolean)
                : allApps.filter(app => getParentFolderPath(app.path) === folderPath);
            renderApps(folderApps);
        }

        function persistManualGroups() {
            window.launchpad
                .saveAppGroups(manualGroups)
                .catch(error => console.error('保存文件夹分组失败:', error));
        }

        function closeFolderContextMenu() {
            folderContextMenu?.remove();
            folderContextMenu = null;
        }

        function beginFolderRename(groupId) {
            editingManualGroupId = groupId;
            closeFolderContextMenu();
            renderApps(allApps);

            const input = document.querySelector(
                `.folder-name-input[data-group-id="${CSS.escape(groupId)}"]`
            );

            if (input) {
                input.focus();
                input.select();
            }
        }

        function showFolderContextMenu(event, app) {
            if (!app.manualGroupId) {
                return;
            }

            event.preventDefault();
            closeFolderContextMenu();

            const menu = document.createElement('div');
            menu.className = 'folder-context-menu';
            menu.addEventListener('click', menuEvent => menuEvent.stopPropagation());

            const renameButton = document.createElement('button');
            renameButton.type = 'button';
            renameButton.textContent = '重命名';
            renameButton.addEventListener('click', () => {
                beginFolderRename(app.manualGroupId);
            });
            menu.appendChild(renameButton);

            menu.style.left = `${Math.max(4, Math.min(event.clientX, window.innerWidth - 124))}px`;
            menu.style.top = `${Math.max(4, Math.min(event.clientY, window.innerHeight - 48))}px`;
            document.body.appendChild(menu);
            folderContextMenu = menu;
        }

        function persistAppOrder(context, orderedPaths) {
            appOrders.set(context || '', orderedPaths);
            window.launchpad
                .saveAppOrder(context, orderedPaths)
                .catch(error => console.error('保存排序失败:', error));
        }

        function reorderFromGridGap(event, grid, orderContext) {
            const draggedPath = event.dataTransfer.getData('text/plain');
            const draggedElement = Array.from(grid.children).find(item =>
                item.dataset.path === draggedPath
            );

            if (!draggedElement) {
                return;
            }

            const targets = Array.from(grid.children).filter(item =>
                item !== draggedElement
            );

            if (!targets.length) {
                return;
            }

            let targetElement = null;
            let closestDistance = Infinity;

            for (const item of targets) {
                const bounds = item.getBoundingClientRect();
                const horizontalDistance = Math.max(
                    bounds.left - event.clientX,
                    0,
                    event.clientX - bounds.right
                );
                const verticalDistance = Math.max(
                    bounds.top - event.clientY,
                    0,
                    event.clientY - bounds.bottom
                );
                const distance = horizontalDistance ** 2 + verticalDistance ** 2;

                if (distance < closestDistance) {
                    closestDistance = distance;
                    targetElement = item;
                }
            }

            if (!targetElement) {
                return;
            }

            const bounds = targetElement.getBoundingClientRect();
            const pointerInTargetRow =
                event.clientY >= bounds.top && event.clientY <= bounds.bottom;
            const insertAfter = pointerInTargetRow
                ? event.clientX >= bounds.left + bounds.width / 2
                : event.clientY >= bounds.top + bounds.height / 2;

            grid.insertBefore(
                draggedElement,
                insertAfter ? targetElement.nextSibling : targetElement
            );

            const orderedPaths = Array.from(grid.children)
                .map(item => item.dataset.path)
                .filter(Boolean);

            persistAppOrder(orderContext, orderedPaths);
            suppressAppClickUntil = Date.now() + 350;
        }

        function reorderAfterGrouping(grid, firstPath, secondPath, folderPath, context) {
            const currentPaths = Array.from(grid.children)
                .map(item => item.dataset.path)
                .filter(Boolean);
            const firstIndex = currentPaths.indexOf(firstPath);
            const secondIndex = currentPaths.indexOf(secondPath);
            const insertAt = Math.min(firstIndex, secondIndex);
            const orderedPaths = currentPaths.filter(path =>
                path !== firstPath && path !== secondPath
            );

            orderedPaths.splice(Math.max(0, insertAt), 0, folderPath);
            persistAppOrder(context, orderedPaths);
        }

        function tryHandleGroupingDrop(event, grid, draggedPath, targetApp, orderContext) {
            if (folderState.currentManualGroupId) {
                return false;
            }

            const draggedApp = allApps.find(app => app.path === draggedPath);
            if (!draggedApp) {
                return false;
            }

            if (targetApp.manualGroupId) {
                const group = manualGroups.find(item => item.id === targetApp.manualGroupId);
                if (
                    !group ||
                    group.context !== (orderContext || null) ||
                    group.appPaths.includes(draggedPath)
                ) {
                    return false;
                }

                group.appPaths.push(draggedPath);
                persistManualGroups();

                const orderedPaths = Array.from(grid.children)
                    .map(item => item.dataset.path)
                    .filter(path => path && path !== draggedPath);
                persistAppOrder(orderContext, orderedPaths);
                suppressAppClickUntil = Date.now() + 350;
                renderApps(allApps);
                return true;
            }

            if (targetApp.path === draggedPath) {
                return false;
            }

            const targetEntry = allApps.find(app => app.path === targetApp.path);
            const targetChildren = targetApp.type === 'folder'
                ? (targetApp.children || []).filter(Boolean)
                : targetEntry
                    ? [targetEntry]
                    : [];

            if (!targetChildren.length) {
                return false;
            }

            const groupAppPaths = [...new Set([
                ...targetChildren.map(child => child.path),
                draggedApp.path,
            ])];

            if (groupAppPaths.length < 2) {
                return false;
            }

            const groupId = globalThis.crypto?.randomUUID
                ? globalThis.crypto.randomUUID()
                : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            const group = {
                id: groupId,
                name: targetApp.type === 'folder' ? targetApp.name : '文件夹',
                context: orderContext || null,
                appPaths: groupAppPaths,
            };

            manualGroups.push(group);
            persistManualGroups();
            reorderAfterGrouping(
                grid,
                draggedPath,
                targetApp.path,
                `manual-folder:${groupId}`,
                orderContext
            );
            suppressAppClickUntil = Date.now() + 350;
            editingManualGroupId = groupId;
            renderApps(allApps);

            const nameInput = document.querySelector(
                `.folder-name-input[data-group-id="${CSS.escape(groupId)}"]`
            );

            if (nameInput) {
                nameInput.focus();
                nameInput.select();
            }

            return true;
        }

        async function removeAppFromManualGroup(appPath) {
            const group = manualGroups.find(item => item.id === folderState.currentManualGroupId);
            if (!group || !group.appPaths.includes(appPath)) {
                return;
            }

            group.appPaths = group.appPaths.filter(path => path !== appPath);

            if (group.appPaths.length < 2) {
                const groupPath = `manual-folder:${group.id}`;
                const parentOrder = await window.launchpad.getAppOrder(group.context);
                const groupIndex = parentOrder.indexOf(groupPath);
                const restoredOrder = parentOrder.filter(path => path !== groupPath);
                const insertAt = groupIndex < 0 ? restoredOrder.length : groupIndex;
                restoredOrder.splice(insertAt, 0, ...group.appPaths);
                const groupIndexInState = manualGroups.indexOf(group);

                if (groupIndexInState >= 0) {
                    manualGroups.splice(groupIndexInState, 1);
                }

                persistAppOrder(group.context, restoredOrder);
            }

            persistManualGroups();
            folderState.currentFolderPath = group.context;
            folderState.currentManualGroupId = null;
            renderApps(allApps);
        }

        function enableAppReordering(element, app, orderContext) {
            element.draggable = true;

            element.addEventListener('dragstart', event => {
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', app.path);
                element.classList.add('dragging');
            });

            element.addEventListener('dragend', () => {
                element.classList.remove('dragging');
                document.querySelectorAll('.app.drag-over').forEach(item => {
                    item.classList.remove('drag-over');
                });
            });

            element.addEventListener('dragover', event => {
                event.preventDefault();
                event.dataTransfer.dropEffect = 'move';
                element.classList.add('drag-over');

                const bounds = element.getBoundingClientRect();
                const inGroupDropZone =
                    event.clientX >= bounds.left + bounds.width * 0.25 &&
                    event.clientX <= bounds.right - bounds.width * 0.25 &&
                    event.clientY >= bounds.top + bounds.height * 0.25 &&
                    event.clientY <= bounds.bottom - bounds.height * 0.25;

                element.classList.toggle(
                    'group-drop-target',
                    inGroupDropZone && !folderState.currentManualGroupId
                );
            });

            element.addEventListener('dragleave', () => {
                element.classList.remove('drag-over');
                element.classList.remove('group-drop-target');
            });

            element.addEventListener('drop', event => {
                event.preventDefault();
                event.stopPropagation();
                element.classList.remove('drag-over');
                element.classList.remove('group-drop-target');

                const draggedPath = event.dataTransfer.getData('text/plain');
                const grid = element.parentElement;
                const draggedElement = Array.from(grid.children).find(item =>
                    item.dataset.path === draggedPath
                );

                if (!draggedElement || draggedElement === element) {
                    return;
                }

                const bounds = element.getBoundingClientRect();
                const inGroupDropZone =
                    event.clientX >= bounds.left + bounds.width * 0.25 &&
                    event.clientX <= bounds.right - bounds.width * 0.25 &&
                    event.clientY >= bounds.top + bounds.height * 0.25 &&
                    event.clientY <= bounds.bottom - bounds.height * 0.25;

                if (
                    inGroupDropZone &&
                    tryHandleGroupingDrop(event, grid, draggedPath, app, orderContext)
                ) {
                    return;
                }

                const draggedBounds = draggedElement.getBoundingClientRect();
                const sameRow = Math.abs(draggedBounds.top - bounds.top) < bounds.height / 2;
                const insertAfter = sameRow
                    ? event.clientX >= bounds.left + bounds.width / 2
                    : event.clientY >= bounds.top + bounds.height / 2;
                grid.insertBefore(
                    draggedElement,
                    insertAfter ? element.nextSibling : element
                );

                const orderedPaths = Array.from(grid.children)
                    .map(item => item.dataset.path)
                    .filter(Boolean);

                appOrders.set(orderContext || '', orderedPaths);
                suppressAppClickUntil = Date.now() + 350;

                window.launchpad
                    .saveAppOrder(orderContext, orderedPaths)
                    .catch(error => console.error('保存排序失败:', error));
            });
        }

        function scheduleRenderApps() {
            if (renderFrameScheduled) {
                return;
            }

            renderFrameScheduled = true;
            requestAnimationFrame(() => {
                renderFrameScheduled = false;
                renderApps(allApps);
            });
        }

        function updateFolderPreview(preview, children) {
            if (!preview) {
                return;
            }

            const icons = (children || [])
                .filter(child => child && child.icon)
                .slice(0, 4)
                .map(child => {
                    const icon = document.createElement('img');
                    icon.className = 'folder-preview-icon';
                    icon.src = child.icon;
                    icon.alt = '';
                    return icon;
                });

            preview.replaceChildren(...icons);
        }

        function renderApps(apps) {

            const container =
                document.getElementById('apps');

            if (!container) {
                return;
            }

            const query =
                document.getElementById('search')
                    ?.value || '';

            let sourceApps = Array.isArray(apps) ? apps : [];

            if (folderState.currentManualGroupId) {
                const manualGroup = manualGroups.find(
                    group => group.id === folderState.currentManualGroupId
                );
                sourceApps = manualGroup
                    ? manualGroup.appPaths
                        .map(appPath => allApps.find(app => app.path === appPath))
                        .filter(Boolean)
                    : [];
            } else if (folderState.currentFolderPath) {
                sourceApps = sourceApps.filter(app => getParentFolderPath(app.path) === folderState.currentFolderPath);
            }

            const folderEntries = buildFolderGrid(sourceApps);
            const normalizedQuery = String(query).trim().toLowerCase();
            const filteredEntries = folderState.currentFolderPath
                ? folderEntries.filter(app => {
                    const name = String(app && app.name ? app.name : '');
                    const path = String(app && app.path ? app.path : '');
                    return !normalizedQuery || name.toLowerCase().includes(normalizedQuery) ||
                        path.toLowerCase().includes(normalizedQuery);
                })
                : typeof window.filterApps === 'function'
                    ? window.filterApps(folderEntries, query)
                    : folderEntries.filter(app => {
                        const name = String(app && app.name ? app.name : '');
                        const path = String(app && app.path ? app.path : '');
                        return name.toLowerCase().includes(normalizedQuery) ||
                            path.toLowerCase().includes(normalizedQuery);
                    });
            const orderContext = folderState.currentFolderPath;
            const orderKey = orderContext || '';
            const savedOrder = appOrders.get(orderKey) || [];
            const filtered = window.sortEntriesByOrder
                ? window.sortEntriesByOrder(filteredEntries, savedOrder)
                : filteredEntries;

            container.innerHTML = '';

            if (!filtered.length) {
                if (folderState.currentFolderPath) {
                    container.innerHTML = '<div class="empty-state">没有匹配的应用</div>';
                    return;
                }

                container.innerHTML = '<div class="empty-state">没有匹配的应用</div>';
                return;
            }

            const visibleApps = filtered.filter(app => {
                if (!app) {
                    return false;
                }

                if (app.type === 'folder') {
                    return Array.isArray(app.children) &&
                        app.children.some(child => child.icon);
                }

                return Boolean(app.icon);
            });

            if (!visibleApps.length && !folderState.currentFolderPath) {
                return;
            }

            const allowReordering =
                !normalizedQuery && visibleApps.length === filtered.length;

            const grid = document.createElement('div');
            grid.className = 'app-grid';

            for (const app of visibleApps) {
                const result = createAppElement(app, allowReordering, orderContext);
                grid.appendChild(result.element);

                if (app && app.type !== 'folder' && app.icon) {
                    setIcon(result.icon, app.icon);
                }
            }

            container.appendChild(grid);

            if (folderState.currentManualGroupId) {
                grid.addEventListener('dragover', event => {
                    if (!event.target.closest('.app')) {
                        event.preventDefault();
                    }
                });

                grid.addEventListener('drop', event => {
                    if (event.target.closest('.app')) {
                        return;
                    }

                    event.preventDefault();
                    event.stopPropagation();
                    const draggedPath = event.dataTransfer.getData('text/plain');
                    if (draggedPath) {
                        removeAppFromManualGroup(draggedPath);
                    }
                });
            } else {
                grid.addEventListener('dragover', event => {
                    if (event.target instanceof Element && event.target.closest('.app')) {
                        return;
                    }

                    event.preventDefault();
                    event.dataTransfer.dropEffect = 'move';
                });

                grid.addEventListener('drop', event => {
                    if (event.target instanceof Element && event.target.closest('.app')) {
                        return;
                    }

                    event.preventDefault();
                    event.stopPropagation();
                    reorderFromGridGap(event, grid, orderContext);
                });
            }

        }


        // =====================================================
        // App 元素
        // =====================================================

        function createAppElement(
            app,
            allowReordering,
            orderContext
        ) {

            const element =
                document.createElement(
                    'div'
                );


            element.className =
                'app';


            // -------------------------------------------------
            // Icon
            // -------------------------------------------------

            const iconWrapper =
                document.createElement(
                    'div'
                );


            iconWrapper.className =
                'icon-wrapper';


            let icon = null;

            if (app && app.type === 'folder') {
                icon = document.createElement('div');
                icon.className = app.manualGroupId
                    ? 'folder-icon manual-folder'
                    : 'folder-icon auto-folder';

                const preview = document.createElement('div');
                preview.className = 'folder-preview';
                updateFolderPreview(preview, app.children);
                icon.appendChild(preview);
                iconWrapper.appendChild(icon);
            } else {
                icon = document.createElement('img');
                icon.className = 'icon';
                icon.alt = app.name;
                icon.addEventListener('error', () => {
                    window.launchpad.getAppIcon(app.path).then(iconUrl => {
                        if (iconUrl) {
                            setIcon(icon, iconUrl);
                        }
                    });
                }, { once: true });
                iconWrapper.appendChild(icon);
            }


            // -------------------------------------------------
            // App Name
            // -------------------------------------------------

            let name;

            if (app.manualGroupId && app.manualGroupId === editingManualGroupId) {

                name = document.createElement('input');
                name.className = 'folder-name-input';
                name.type = 'text';
                name.value = app.name;
                name.maxLength = 80;
                name.dataset.groupId = app.manualGroupId;
                name.setAttribute('aria-label', '文件夹名称');
                name.addEventListener('click', event => event.stopPropagation());
                name.addEventListener('keydown', event => {
                    event.stopPropagation();

                    if (event.key === 'Enter') {
                        name.blur();
                    } else if (event.key === 'Escape') {
                        editingManualGroupId = null;
                        renderApps(allApps);
                    }
                });
                name.addEventListener('blur', () => {
                    if (editingManualGroupId !== app.manualGroupId) {
                        return;
                    }

                    const group = manualGroups.find(item => item.id === app.manualGroupId);

                    if (group) {
                        group.name = name.value.trim().slice(0, 80) || '文件夹';
                        persistManualGroups();
                    }

                    editingManualGroupId = null;
                    renderApps(allApps);
                });

            } else {

                name = document.createElement('div');
                name.className = 'name';
                name.textContent = app.name;

            }


            // -------------------------------------------------
            // 组合
            // -------------------------------------------------

            element.appendChild(
                iconWrapper
            );

            element.appendChild(
                name
            );


            element.dataset.path =
                app.path;

            if (allowReordering) {
                enableAppReordering(element, app, orderContext);
            }

            if (app.manualGroupId) {
                element.addEventListener('contextmenu', event => {
                    showFolderContextMenu(event, app);
                });
            }


            // -------------------------------------------------
            // 点击 App
            // -------------------------------------------------

            element.addEventListener(
                'click',
                event => {

                    event.stopPropagation();

                    if (Date.now() < suppressAppClickUntil) {
                        return;
                    }

                    if (app && app.type === 'folder') {
                        showFolder(app.path, app.manualGroupId || null);
                        return;
                    }

                    window.launchpad
                        .launchApplication(
                            app.path
                        );

                }
            );


            return {

                element:
                    element,

                icon:
                    icon

            };

        }


        // =====================================================
        // 设置 Icon
        // =====================================================

        function setIcon(
            iconElement,
            iconUrl
        ) {

            if (
                !iconUrl
            ) {

                return;

            }


            iconElement.src =
                iconUrl;

        }


        // =====================================================
        // 加载 App
        // =====================================================

        async function loadApps() {

            const [apps, rootOrder, groups] = await Promise.all([
                window.launchpad.getApplications(),
                window.launchpad.getAppOrder(null),
                window.launchpad.getAppGroups(),
            ]);

            appOrders.set('', rootOrder);
            manualGroups.splice(0, manualGroups.length, ...(Array.isArray(groups) ? groups : []));

            allApps.length = 0;
            allApps.push(...apps);

            for (const app of allApps) {
                const iconUrl = pendingIconUrls.get(app.path);
                if (iconUrl) {
                    app.icon = iconUrl;
                }
            }

            pendingIconUrls.clear();
            renderApps(allApps);

        }


        // =====================================================
        // Swift Icon 加载完成
        // =====================================================

        window.addEventListener(
            'launchpad-applications-updated',
            event => {

                const apps = event.detail;

                if (!Array.isArray(apps)) {
                    return;
                }

                allApps.length = 0;
                allApps.push(...apps);
                renderApps(allApps);

            }
        );


        window.addEventListener(
            'launchpad-icon-loaded',
            event => {

                const data =
                    event.detail;


                if (
                    !data ||
                    !data.path ||
                    !data.icon
                ) {

                    return;

                }


                const app =
                    allApps.find(
                        item => item.path === data.path
                    );

                if (!app) {
                    pendingIconUrls.set(data.path, data.icon);
                    return;
                }

                if (app) {
                    app.icon = data.icon;
                }

                const appElement =
                    document.querySelector(
                        `.app[data-path="${CSS.escape(data.path)}"]`
                    );

                const iconElement =
                    appElement?.querySelector('.icon');

                if (iconElement) {
                    setIcon(iconElement, data.icon);
                    return;
                }

                const parentPath = getParentFolderPath(app.path);
                const folderElement = parentPath
                    ? document.querySelector(
                        `.app[data-path="${CSS.escape(parentPath)}"]`
                    )
                    : null;

                if (folderElement) {
                    const folderEntry = buildFolderGrid(allApps).find(entry =>
                        entry && entry.type === 'folder' && entry.path === parentPath
                    );

                    if (folderEntry) {
                        updateFolderPreview(
                            folderElement.querySelector('.folder-preview'),
                            folderEntry.children
                        );
                        return;
                    }
                }

                scheduleRenderApps();

            }
        );


        const searchInput =
            document.getElementById(
                'search'
            );

        if (searchInput) {
            searchInput.addEventListener(
                'input',
                () => {
                    renderApps(allApps);
                }
            );
        }


        // =====================================================
        // 点击空白区域
        // =====================================================

        document.addEventListener(
            'click',
            event => {

                const target =
                    event.target;

                if (
                    target && (
                        target.closest('.app') ||
                        target.closest('#search') ||
                        target.closest('.search-box') ||
                        target.closest('.toolbar') ||
                        target.closest('.folder-context-menu')
                    )
                ) {

                    return;

                }


                if (folderState.currentFolderPath) {
                    showFolder(null);
                    return;
                }

                window.launchpad.hide();

            }
        );


        // =====================================================
        // ESC 隐藏
        // =====================================================

        window.addEventListener(
            'keydown',
            event => {

                if (
                    event.key === 'Escape'
                ) {

                    if (folderContextMenu) {
                        closeFolderContextMenu();
                        return;
                    }

                    if (editingManualGroupId) {
                        editingManualGroupId = null;
                        renderApps(allApps);
                        return;
                    }

                    window.launchpad.hide();

                }

            }
        );


        // =====================================================
        // 启动
        // =====================================================

        requestAnimationFrame(() => {
            requestAnimationFrame(loadApps);
        });

    </script>

</body>
